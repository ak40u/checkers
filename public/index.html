<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkers Online</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --accent: #22c55e;
      --accent-dark: #16a34a;
      --bg-dark: #0f172a;
      --bg-card: rgba(30, 41, 59, 0.8);
      --bg-glass: rgba(255, 255, 255, 0.05);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.1);
      --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      --glow-primary: 0 0 40px rgba(99, 102, 241, 0.3);
      --glow-accent: 0 0 40px rgba(34, 197, 94, 0.3);
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      color: var(--text-primary);
      overflow-x: hidden;
    }

    /* Animated background */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(ellipse at 20% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(139, 92, 246, 0.15) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, rgba(34, 197, 94, 0.05) 0%, transparent 70%);
      pointer-events: none;
      z-index: -1;
    }

    h1 {
      font-size: 2.8em;
      font-weight: 800;
      margin-bottom: 24px;
      text-align: center;
      background: linear-gradient(135deg, #fff 0%, #c7d2fe 50%, #a5b4fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.02em;
    }

    /* Glass card base */
    .glass-card {
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      box-shadow: var(--shadow);
    }

    /* Menu Screen */
    #menu {
      padding: 48px 40px;
      text-align: center;
      max-width: 420px;
      width: 100%;
    }

    #menu h2 {
      color: var(--text-primary);
      margin-bottom: 32px;
      font-size: 1.75em;
      font-weight: 700;
    }

    .menu-input {
      width: 100%;
      padding: 16px 20px;
      font-size: 1.1em;
      font-family: inherit;
      background: var(--bg-glass);
      border: 2px solid var(--border-color);
      border-radius: 14px;
      margin-bottom: 16px;
      text-align: center;
      color: var(--text-primary);
      transition: all 0.3s ease;
    }

    .menu-input::placeholder {
      color: var(--text-secondary);
    }

    .menu-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2);
    }

    .menu-btn {
      width: 100%;
      padding: 18px 30px;
      font-size: 1.15em;
      font-weight: 600;
      font-family: inherit;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      margin-bottom: 12px;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .menu-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: 0.5s;
    }

    .menu-btn:hover::before {
      left: 100%;
    }

    .menu-btn:hover {
      transform: translateY(-2px);
    }

    .menu-btn:active {
      transform: translateY(0);
    }

    .btn-create {
      background: linear-gradient(135deg, var(--accent) 0%, #10b981 100%);
      color: white;
      box-shadow: 0 8px 24px rgba(34, 197, 94, 0.35);
    }

    .btn-create:hover {
      box-shadow: var(--glow-accent), 0 8px 24px rgba(34, 197, 94, 0.5);
    }

    .btn-join {
      background: linear-gradient(135deg, var(--primary) 0%, #8b5cf6 100%);
      color: white;
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.35);
    }

    .btn-join:hover {
      box-shadow: var(--glow-primary), 0 8px 24px rgba(99, 102, 241, 0.5);
    }

    .divider {
      color: var(--text-secondary);
      margin: 28px 0;
      font-size: 0.95em;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border-color);
    }

    /* Waiting Screen */
    #waiting {
      display: none;
      padding: 48px 40px;
      text-align: center;
      max-width: 480px;
      width: 100%;
    }

    #waiting h2 {
      color: var(--text-primary);
      margin-bottom: 16px;
      font-weight: 700;
      font-size: 1.5em;
    }

    #waiting p {
      color: var(--text-secondary);
    }

    .room-code {
      background: linear-gradient(135deg, var(--primary) 0%, #8b5cf6 100%);
      color: white;
      font-size: 3em;
      font-weight: 800;
      padding: 24px 48px;
      border-radius: 20px;
      margin: 28px 0;
      letter-spacing: 12px;
      display: inline-block;
      box-shadow: var(--glow-primary);
      font-variant-numeric: tabular-nums;
    }

    .waiting-text {
      color: var(--text-secondary);
      font-size: 1.15em;
      margin-top: 20px;
    }

    .waiting-text::after {
      content: '';
      animation: dots 1.5s infinite;
    }

    @keyframes dots {
      0%, 20% { content: ''; }
      40% { content: '.'; }
      60% { content: '..'; }
      80%, 100% { content: '...'; }
    }

    /* Game Screen */
    #game {
      display: none;
      text-align: center;
    }

    .game-info {
      padding: 16px 28px;
      margin-bottom: 24px;
    }

    .player-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .player {
      font-size: 1em;
      font-weight: 600;
      padding: 12px 20px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.3s ease;
    }

    .player.white-player {
      background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0.05) 100%);
      border: 1px solid rgba(255,255,255,0.2);
    }

    .player.black-player {
      background: linear-gradient(135deg, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.2) 100%);
      border: 1px solid rgba(255,255,255,0.1);
    }

    .player.active {
      box-shadow: 0 0 0 3px var(--accent), var(--glow-accent);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 3px var(--accent), 0 0 20px rgba(34, 197, 94, 0.4); }
      50% { box-shadow: 0 0 0 5px var(--accent), 0 0 30px rgba(34, 197, 94, 0.6); }
    }

    .player-indicator {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.3);
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
    }

    .player-indicator.white {
      background: linear-gradient(145deg, #fff 0%, #e2e8f0 100%);
    }

    .player-indicator.black {
      background: linear-gradient(145deg, #334155 0%, #1e293b 100%);
    }

    .turn-indicator {
      font-size: 1.1em;
      font-weight: 700;
      color: var(--text-secondary);
      padding: 8px 16px;
      border-radius: 10px;
      background: var(--bg-glass);
    }

    /* Board */
    .board-container {
      display: inline-block;
      padding: 16px;
      background: linear-gradient(145deg, #78350f 0%, #451a03 100%);
      border-radius: 20px;
      box-shadow:
        var(--shadow),
        inset 0 2px 4px rgba(255,255,255,0.1),
        0 0 0 1px rgba(255,255,255,0.05);
    }

    .board {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 0;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.3);
    }

    .cell {
      width: 64px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition: all 0.15s ease;
    }

    .cell.light {
      background: linear-gradient(145deg, #fef3c7 0%, #fde68a 100%);
    }

    .cell.dark {
      background: linear-gradient(145deg, #92400e 0%, #78350f 100%);
    }

    .cell.selected {
      background: linear-gradient(145deg, #86efac 0%, #4ade80 100%) !important;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.2);
    }

    .cell.possible-move {
      background: linear-gradient(145deg, #bbf7d0 0%, #86efac 100%) !important;
    }

    .cell.possible-move::after {
      content: '';
      width: 24px;
      height: 24px;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 50%;
      position: absolute;
      pointer-events: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      animation: pulseMove 1.5s infinite;
    }

    @keyframes pulseMove {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.1); opacity: 0.8; }
    }

    .cell.last-move {
      box-shadow: inset 0 0 0 4px rgba(250, 204, 21, 0.7);
    }

    /* Pieces */
    .piece {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      position: relative;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }

    .piece:hover {
      transform: scale(1.08) translateY(-2px);
    }

    .piece.white {
      background:
        radial-gradient(ellipse at 30% 20%, rgba(255,255,255,0.9) 0%, transparent 50%),
        linear-gradient(145deg, #f8fafc 0%, #cbd5e1 50%, #94a3b8 100%);
      border: 3px solid #e2e8f0;
      box-shadow:
        inset 0 -8px 16px rgba(0,0,0,0.15),
        inset 0 4px 8px rgba(255,255,255,0.5),
        0 8px 16px rgba(0,0,0,0.3),
        0 2px 4px rgba(0,0,0,0.2);
    }

    .piece.black {
      background:
        radial-gradient(ellipse at 30% 20%, rgba(100,116,139,0.5) 0%, transparent 50%),
        linear-gradient(145deg, #475569 0%, #1e293b 50%, #0f172a 100%);
      border: 3px solid #334155;
      box-shadow:
        inset 0 -8px 16px rgba(0,0,0,0.4),
        inset 0 4px 8px rgba(255,255,255,0.1),
        0 8px 16px rgba(0,0,0,0.4),
        0 2px 4px rgba(0,0,0,0.3);
    }

    .piece.king::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 28px;
      height: 28px;
      background: linear-gradient(145deg, #fbbf24 0%, #f59e0b 50%, #d97706 100%);
      border-radius: 50%;
      box-shadow:
        0 2px 8px rgba(245, 158, 11, 0.5),
        inset 0 2px 4px rgba(255,255,255,0.4);
    }

    .piece.king::after {
      content: '♔';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 20px;
      color: #78350f;
      text-shadow: 0 1px 2px rgba(255,255,255,0.5);
      z-index: 1;
    }

    /* Messages */
    .message {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      padding: 16px 32px;
      border-radius: 14px;
      font-size: 1em;
      font-weight: 600;
      z-index: 100;
      animation: slideDown 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.1);
    }

    .message.error {
      background: rgba(239, 68, 68, 0.9);
      box-shadow: 0 8px 32px rgba(239, 68, 68, 0.4);
    }

    .message.success {
      background: rgba(34, 197, 94, 0.9);
      box-shadow: 0 8px 32px rgba(34, 197, 94, 0.4);
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateX(-50%) translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    }

    /* Win Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(8px);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      padding: 56px 64px;
      border-radius: 28px;
      text-align: center;
      animation: modalIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: var(--shadow), var(--glow-primary);
    }

    @keyframes modalIn {
      from {
        transform: scale(0.9) translateY(20px);
        opacity: 0;
      }
      to {
        transform: scale(1) translateY(0);
        opacity: 1;
      }
    }

    .modal h2 {
      font-size: 2.2em;
      font-weight: 800;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #fff 0%, #c7d2fe 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .modal .winner-emoji {
      font-size: 5em;
      margin: 24px 0;
      animation: bounce 1s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .modal button {
      padding: 16px 48px;
      font-size: 1.1em;
      font-weight: 600;
      font-family: inherit;
      background: linear-gradient(135deg, var(--primary) 0%, #8b5cf6 100%);
      color: white;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      margin-top: 24px;
      transition: all 0.3s ease;
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.35);
    }

    .modal button:hover {
      transform: translateY(-2px);
      box-shadow: var(--glow-primary), 0 8px 24px rgba(99, 102, 241, 0.5);
    }

    /* Responsive */
    @media (max-width: 600px) {
      body {
        padding: 16px;
      }

      h1 {
        font-size: 2em;
        margin-bottom: 16px;
      }

      #menu, #waiting {
        padding: 32px 24px;
      }

      .cell {
        width: 44px;
        height: 44px;
      }

      .piece {
        width: 36px;
        height: 36px;
      }

      .piece.king::before {
        width: 20px;
        height: 20px;
      }

      .piece.king::after {
        font-size: 14px;
      }

      .cell.possible-move::after {
        width: 16px;
        height: 16px;
      }

      .board-container {
        padding: 10px;
      }

      .player-info {
        flex-direction: column;
        gap: 12px;
      }

      .game-info {
        padding: 12px 16px;
      }

      .room-code {
        font-size: 2.2em;
        padding: 20px 32px;
        letter-spacing: 8px;
      }

      .modal-content {
        padding: 40px 32px;
        margin: 16px;
      }

      .modal h2 {
        font-size: 1.8em;
      }

      .modal .winner-emoji {
        font-size: 4em;
      }
    }
  </style>
</head>
<body>
  <h1 id="pageTitle"></h1>

  <!-- Menu Screen -->
  <div id="menu" class="glass-card">
    <h2 id="menuHello"></h2>
    <input type="text" id="playerName" class="menu-input" maxlength="15" autocomplete="off">
    <button class="menu-btn btn-create" onclick="createGame()" id="btnCreate"></button>
    <div class="divider" id="dividerOr"></div>
    <input type="text" id="roomCodeInput" class="menu-input" maxlength="4" autocomplete="off">
    <button class="menu-btn btn-join" onclick="joinGame()" id="btnJoin"></button>
  </div>

  <!-- Waiting Screen -->
  <div id="waiting" class="glass-card">
    <h2 id="waitingTitle"></h2>
    <p id="waitingTellCode"></p>
    <div class="room-code" id="displayRoomCode">----</div>
    <p class="waiting-text" id="waitingText"></p>
  </div>

  <!-- Game Screen -->
  <div id="game">
    <div class="game-info glass-card">
      <div class="player-info">
        <div class="player white-player" id="whitePlayer">
          <div class="player-indicator white"></div>
          <span id="whiteName"></span>
        </div>
        <div class="turn-indicator" id="turnText"></div>
        <div class="player black-player" id="blackPlayer">
          <div class="player-indicator black"></div>
          <span id="blackName"></span>
        </div>
      </div>
    </div>

    <div class="board-container">
      <div class="board" id="board"></div>
    </div>
  </div>

  <!-- Win Modal -->
  <div class="modal" id="winModal">
    <div class="modal-content">
      <h2 id="winnerText"></h2>
      <div class="winner-emoji">🎉</div>
      <button onclick="location.reload()" id="btnPlayAgain"></button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    // Language detection and i18n
    const userLang = navigator.language || navigator.userLanguage;
    const isRussian = userLang.startsWith('ru');

    const i18n = {
      ru: {
        title: 'Шашки',
        hello: 'Привет!',
        yourName: 'Ваше имя',
        createGame: 'Создать игру',
        or: '— или —',
        gameCode: 'Код игры',
        join: 'Присоединиться',
        gameCreated: 'Игра создана!',
        tellCode: 'Скажите этот код второму игроку:',
        waiting: 'Ждём второго игрока',
        white: 'Белые',
        black: 'Чёрные',
        whiteTurn: 'Ход белых',
        blackTurn: 'Ход чёрных',
        yourTurn: 'Ваш ход!',
        notYourTurn: 'Сейчас не ваш ход!',
        mustContinue: 'Нужно продолжить бить!',
        enterCode: 'Введите 4-значный код игры',
        noConnection: 'Нет соединения с сервером!',
        opponentLeft: 'Соперник отключился',
        connectionError: 'Ошибка соединения!',
        connectionLost: 'Соединение потеряно!',
        youWin: 'Вы победили!',
        opponentWins: 'Победил соперник',
        playAgain: 'Играть снова',
        playerJoined: 'присоединился!',
        defaultName: 'Игрок',
        // Server error codes
        errors: {
          GAME_NOT_FOUND: 'Игра не найдена. Проверьте код.',
          GAME_FULL: 'Игра уже заполнена.',
          GAME_OVER: 'Игра уже закончена!',
          INVALID_COORDS: 'Неверные координаты!',
          NOT_YOUR_TURN: 'Сейчас не ваш ход!',
          NOT_YOUR_PIECE: 'Это не ваша шашка!',
          MUST_CONTINUE: 'Нужно продолжить бить этой шашкой!',
          INVALID_MOVE: 'Неверный ход!',
          CELL_OCCUPIED: 'Клетка занята!',
          PATH_BLOCKED: 'Путь заблокирован!',
          CANT_JUMP_TWO: 'Нельзя перепрыгнуть две шашки!',
          MUST_CAPTURE: 'Нужно бить!',
          FORWARD_ONLY: 'Шашки ходят только вперёд!'
        }
      },
      en: {
        title: 'Checkers',
        hello: 'Hello!',
        yourName: 'Your name',
        createGame: 'Create Game',
        or: '— or —',
        gameCode: 'Game code',
        join: 'Join',
        gameCreated: 'Game created!',
        tellCode: 'Tell this code to the other player:',
        waiting: 'Waiting for opponent',
        white: 'White',
        black: 'Black',
        whiteTurn: "White's turn",
        blackTurn: "Black's turn",
        yourTurn: 'Your turn!',
        notYourTurn: "It's not your turn!",
        mustContinue: 'Must continue capturing!',
        enterCode: 'Enter 4-digit game code',
        noConnection: 'No server connection!',
        opponentLeft: 'Opponent disconnected',
        connectionError: 'Connection error!',
        connectionLost: 'Connection lost!',
        youWin: 'You won!',
        opponentWins: 'Opponent wins',
        playAgain: 'Play again',
        playerJoined: 'joined!',
        defaultName: 'Player',
        // Server error codes
        errors: {
          GAME_NOT_FOUND: 'Game not found. Check the code.',
          GAME_FULL: 'Game is already full.',
          GAME_OVER: 'Game is already over!',
          INVALID_COORDS: 'Invalid coordinates!',
          NOT_YOUR_TURN: "It's not your turn!",
          NOT_YOUR_PIECE: "That's not your piece!",
          MUST_CONTINUE: 'Must continue capturing with this piece!',
          INVALID_MOVE: 'Invalid move!',
          CELL_OCCUPIED: 'Cell is occupied!',
          PATH_BLOCKED: 'Path is blocked!',
          CANT_JUMP_TWO: "Can't jump over two pieces!",
          MUST_CAPTURE: 'Must capture!',
          FORWARD_ONLY: 'Pieces can only move forward!'
        }
      }
    };

    const t = isRussian ? i18n.ru : i18n.en;

    // Set page language and title
    document.documentElement.lang = isRussian ? 'ru' : 'en';
    document.title = t.title;

    const socket = io();

    // Sound system using Web Audio API
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
      // Resume audio context (required for mobile browsers)
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      const oscillator = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      oscillator.connect(gainNode);
      gainNode.connect(audioCtx.destination);

      if (type === 'yourTurn') {
        // Pleasant bell-like sound for "your turn"
        oscillator.frequency.setValueAtTime(880, audioCtx.currentTime); // A5
        oscillator.frequency.setValueAtTime(1100, audioCtx.currentTime + 0.1); // C#6
        oscillator.frequency.setValueAtTime(1320, audioCtx.currentTime + 0.2); // E6
        oscillator.type = 'sine';
        gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gainNode.gain.exponentialDecayTo && gainNode.gain.exponentialDecayTo(0.01, audioCtx.currentTime + 0.5);
        gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
        oscillator.start(audioCtx.currentTime);
        oscillator.stop(audioCtx.currentTime + 0.5);
      } else if (type === 'move') {
        // Short click for piece move
        oscillator.frequency.setValueAtTime(600, audioCtx.currentTime);
        oscillator.type = 'sine';
        gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        oscillator.start(audioCtx.currentTime);
        oscillator.stop(audioCtx.currentTime + 0.1);
      } else if (type === 'capture') {
        // Satisfying pop for capture
        oscillator.frequency.setValueAtTime(300, audioCtx.currentTime);
        oscillator.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.15);
        oscillator.type = 'sine';
        gainNode.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
        oscillator.start(audioCtx.currentTime);
        oscillator.stop(audioCtx.currentTime + 0.15);
      } else if (type === 'win') {
        // Victory fanfare
        playNote(523, 0, 0.2);    // C5
        playNote(659, 0.15, 0.2); // E5
        playNote(784, 0.3, 0.2);  // G5
        playNote(1047, 0.45, 0.4); // C6
        return;
      } else if (type === 'lose') {
        // Sad sound for losing
        oscillator.frequency.setValueAtTime(400, audioCtx.currentTime);
        oscillator.frequency.linearRampToValueAtTime(200, audioCtx.currentTime + 0.5);
        oscillator.type = 'sine';
        gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
        oscillator.start(audioCtx.currentTime);
        oscillator.stop(audioCtx.currentTime + 0.5);
      }
    }

    function playNote(freq, delay, duration) {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.frequency.value = freq;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime + delay);
      gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + delay + duration);
      osc.start(audioCtx.currentTime + delay);
      osc.stop(audioCtx.currentTime + delay + duration);
    }

    let myColor = null;
    let currentBoard = null;
    let selectedPiece = null;
    let isMyTurn = false;
    let possibleMoves = [];
    let mustContinueFrom = null;

    // DOM Elements
    const menuEl = document.getElementById('menu');
    const waitingEl = document.getElementById('waiting');
    const gameEl = document.getElementById('game');
    const boardEl = document.getElementById('board');

    // Apply translations to static elements
    function applyTranslations() {
      document.getElementById('pageTitle').textContent = t.title;
      document.getElementById('menuHello').textContent = t.hello;
      document.getElementById('playerName').placeholder = t.yourName;
      document.getElementById('btnCreate').textContent = t.createGame;
      document.getElementById('dividerOr').textContent = t.or;
      document.getElementById('roomCodeInput').placeholder = t.gameCode;
      document.getElementById('btnJoin').textContent = t.join;
      document.getElementById('waitingTitle').textContent = t.gameCreated;
      document.getElementById('waitingTellCode').textContent = t.tellCode;
      document.getElementById('waitingText').textContent = t.waiting;
      document.getElementById('btnPlayAgain').textContent = t.playAgain;
    }

    // Apply translations on load
    applyTranslations();

    // Create game
    function createGame() {
      const name = document.getElementById('playerName').value.trim() || t.defaultName;
      socket.emit('createGame', name);
    }

    // Join game
    function joinGame() {
      const code = document.getElementById('roomCodeInput').value.trim();
      const name = document.getElementById('playerName').value.trim() || t.defaultName;

      if (code.length !== 4) {
        showMessage(t.enterCode, 'error');
        return;
      }

      socket.emit('joinGame', { roomCode: code, playerName: name });
    }

    // Socket events
    socket.on('gameCreated', ({ roomCode, color, board }) => {
      myColor = color;
      currentBoard = board;
      document.getElementById('displayRoomCode').textContent = roomCode;
      menuEl.style.display = 'none';
      waitingEl.style.display = 'block';
    });

    socket.on('gameJoined', ({ roomCode, color, board, opponentName }) => {
      myColor = color;
      currentBoard = board;
      menuEl.style.display = 'none';
    });

    socket.on('opponentJoined', ({ opponentName }) => {
      playSound('yourTurn');
      showMessage(`${opponentName} ${t.playerJoined}`, 'success');
    });

    socket.on('gameStart', ({ board, currentTurn, whiteName, blackName }) => {
      currentBoard = board;
      menuEl.style.display = 'none';
      waitingEl.style.display = 'none';
      gameEl.style.display = 'block';

      document.getElementById('whiteName').textContent = whiteName;
      document.getElementById('blackName').textContent = blackName;

      isMyTurn = (currentTurn === myColor);
      updateTurnIndicator(currentTurn);
      renderBoard();
    });

    socket.on('gameUpdate', ({ board, currentTurn, lastMove, captured, mustContinue, winner }) => {
      const wasMyTurn = isMyTurn;
      currentBoard = board;
      isMyTurn = (currentTurn === myColor);
      mustContinueFrom = mustContinue;
      selectedPiece = null;
      possibleMoves = [];

      // Play sounds
      if (captured) {
        playSound('capture');
      } else if (lastMove) {
        playSound('move');
      }

      // Play "your turn" sound when turn switches to this player
      if (isMyTurn && !wasMyTurn && !winner) {
        setTimeout(() => playSound('yourTurn'), 200);
      }

      updateTurnIndicator(currentTurn);
      renderBoard(lastMove);

      if (winner) {
        showWinner(winner);
      }
    });

    socket.on('opponentLeft', () => {
      showMessage(t.opponentLeft, 'error');
      setTimeout(() => location.reload(), 2000);
    });

    socket.on('error', (code) => {
      // Translate error code or show as-is if not found
      const msg = t.errors[code] || code;
      showMessage(msg, 'error');
      // Re-render to show current state
      renderBoard();
    });

    socket.on('connect_error', () => {
      showMessage(t.connectionError, 'error');
    });

    socket.on('disconnect', () => {
      showMessage(t.connectionLost, 'error');
    });

    // Update turn indicator
    function updateTurnIndicator(turn) {
      const whitePlayer = document.getElementById('whitePlayer');
      const blackPlayer = document.getElementById('blackPlayer');
      const turnText = document.getElementById('turnText');

      whitePlayer.classList.toggle('active', turn === 'white');
      blackPlayer.classList.toggle('active', turn === 'black');

      if (turn === myColor) {
        turnText.textContent = t.yourTurn;
        turnText.style.color = '#4caf50';
      } else {
        turnText.textContent = turn === 'white' ? t.whiteTurn : t.blackTurn;
        turnText.style.color = '#333';
      }
    }

    // Render the board
    function renderBoard(lastMove = null) {
      boardEl.innerHTML = '';

      // Flip board for black player
      const rows = myColor === 'black' ? [7,6,5,4,3,2,1,0] : [0,1,2,3,4,5,6,7];
      const cols = myColor === 'black' ? [7,6,5,4,3,2,1,0] : [0,1,2,3,4,5,6,7];

      for (const row of rows) {
        for (const col of cols) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.className += (row + col) % 2 === 0 ? ' light' : ' dark';
          cell.dataset.row = row;
          cell.dataset.col = col;

          // Highlight last move
          if (lastMove) {
            if ((row === lastMove.from.row && col === lastMove.from.col) ||
                (row === lastMove.to.row && col === lastMove.to.col)) {
              cell.classList.add('last-move');
            }
          }

          // Highlight selected piece
          if (selectedPiece && selectedPiece.row === row && selectedPiece.col === col) {
            cell.classList.add('selected');
          }

          // Highlight possible moves
          if (possibleMoves.some(m => m.row === row && m.col === col)) {
            cell.classList.add('possible-move');
          }

          // Add piece if exists
          const piece = currentBoard[row][col];
          if (piece) {
            const pieceEl = document.createElement('div');
            pieceEl.className = 'piece';
            pieceEl.className += piece.startsWith('white') ? ' white' : ' black';
            if (piece.includes('King')) {
              pieceEl.classList.add('king');
            }
            cell.appendChild(pieceEl);
          }

          cell.addEventListener('click', () => handleCellClick(row, col));
          boardEl.appendChild(cell);
        }
      }
    }

    // Handle cell click
    function handleCellClick(row, col) {
      if (!isMyTurn) {
        showMessage(t.notYourTurn, 'error');
        return;
      }

      const piece = currentBoard[row][col];

      // If clicking on possible move - make the move
      if (possibleMoves.some(m => m.row === row && m.col === col)) {
        if (!socket.connected) {
          showMessage(t.noConnection, 'error');
          return;
        }
        socket.emit('makeMove', {
          from: selectedPiece,
          to: { row, col }
        });
        // Clear selection immediately for better UX
        selectedPiece = null;
        possibleMoves = [];
        renderBoard();
        return;
      }

      // If must continue capturing with specific piece
      if (mustContinueFrom) {
        if (row !== mustContinueFrom.row || col !== mustContinueFrom.col) {
          showMessage(t.mustContinue, 'error');
          return;
        }
      }

      // If clicking on own piece - select it
      if (piece && piece.startsWith(myColor)) {
        selectedPiece = { row, col };
        possibleMoves = calculatePossibleMoves(row, col);
        renderBoard();
      } else {
        selectedPiece = null;
        possibleMoves = [];
        renderBoard();
      }
    }

    // Check if a specific piece can capture
    function pieceCanCapture(row, col, color) {
      const piece = currentBoard[row][col];
      if (!piece) return false;

      const isKing = piece.includes('King');
      const directions = [[-1, -1], [-1, 1], [1, -1], [1, 1]];

      if (isKing) {
        for (const [dr, dc] of directions) {
          let r = row + dr;
          let c = col + dc;
          let foundEnemy = false;

          while (r >= 0 && r < 8 && c >= 0 && c < 8) {
            const cell = currentBoard[r][c];
            if (cell) {
              if (cell.startsWith(color)) break;
              if (foundEnemy) break;
              foundEnemy = true;
            } else if (foundEnemy) {
              return true;
            }
            r += dr;
            c += dc;
          }
        }
      } else {
        for (const [dr, dc] of directions) {
          const midRow = row + dr;
          const midCol = col + dc;
          const endRow = row + dr * 2;
          const endCol = col + dc * 2;

          if (endRow >= 0 && endRow < 8 && endCol >= 0 && endCol < 8) {
            const midPiece = currentBoard[midRow]?.[midCol];
            const endCell = currentBoard[endRow]?.[endCol];
            if (midPiece && !midPiece.startsWith(color) && !endCell) {
              return true;
            }
          }
        }
      }
      return false;
    }

    // Check if any piece of color can capture
    function anyPieceCanCapture(color) {
      for (let row = 0; row < 8; row++) {
        for (let col = 0; col < 8; col++) {
          const piece = currentBoard[row][col];
          if (piece && piece.startsWith(color)) {
            if (pieceCanCapture(row, col, color)) {
              return true;
            }
          }
        }
      }
      return false;
    }

    // Calculate possible moves for a piece
    function calculatePossibleMoves(row, col) {
      const piece = currentBoard[row][col];
      if (!piece) return [];

      const moves = [];
      const isKing = piece.includes('King');
      const color = piece.startsWith('white') ? 'white' : 'black';
      const directions = [[-1, -1], [-1, 1], [1, -1], [1, 1]];

      // For regular pieces: forward directions only
      let moveDirections;
      if (isKing) {
        moveDirections = directions;
      } else if (color === 'white') {
        moveDirections = [[-1, -1], [-1, 1]]; // White moves up
      } else {
        moveDirections = [[1, -1], [1, 1]]; // Black moves down
      }

      // Check if this piece can capture
      let hasCaptures = false;

      if (isKing) {
        // King captures: can capture from distance
        for (const [dr, dc] of directions) {
          let r = row + dr;
          let c = col + dc;
          let foundEnemy = null;

          while (r >= 0 && r < 8 && c >= 0 && c < 8) {
            const cell = currentBoard[r][c];

            if (cell) {
              if (cell.startsWith(color)) {
                // Own piece - stop
                break;
              } else if (foundEnemy) {
                // Second enemy - stop
                break;
              } else {
                // Found enemy
                foundEnemy = { row: r, col: c };
              }
            } else if (foundEnemy) {
              // Empty cell after enemy - can land here
              moves.push({ row: r, col: c, isCapture: true, captured: foundEnemy });
              hasCaptures = true;
            }

            r += dr;
            c += dc;
          }
        }
      } else {
        // Regular piece captures (all directions allowed for capture)
        for (const [dr, dc] of directions) {
          const midRow = row + dr;
          const midCol = col + dc;
          const endRow = row + dr * 2;
          const endCol = col + dc * 2;

          if (endRow >= 0 && endRow < 8 && endCol >= 0 && endCol < 8) {
            const midPiece = currentBoard[midRow][midCol];
            const endCell = currentBoard[endRow][endCol];

            if (midPiece && !midPiece.startsWith(color) && !endCell) {
              moves.push({ row: endRow, col: endCol, isCapture: true });
              hasCaptures = true;
            }
          }
        }
      }

      // If this piece has no captures, check if ANY piece must capture
      // If so, return empty (can't move this piece)
      if (!hasCaptures && !mustContinueFrom) {
        if (anyPieceCanCapture(color)) {
          return []; // Must capture with another piece
        }

        // No captures anywhere - add simple moves
        if (isKing) {
          // King moves: any distance diagonally
          for (const [dr, dc] of directions) {
            let r = row + dr;
            let c = col + dc;

            while (r >= 0 && r < 8 && c >= 0 && c < 8) {
              if (currentBoard[r][c]) break; // Stop at any piece
              moves.push({ row: r, col: c, isCapture: false });
              r += dr;
              c += dc;
            }
          }
        } else {
          // Regular piece moves: one step forward
          for (const [dr, dc] of moveDirections) {
            const newRow = row + dr;
            const newCol = col + dc;

            if (newRow >= 0 && newRow < 8 && newCol >= 0 && newCol < 8) {
              if (!currentBoard[newRow][newCol]) {
                moves.push({ row: newRow, col: newCol, isCapture: false });
              }
            }
          }
        }
      }

      return moves;
    }

    // Show message
    function showMessage(text, type = 'info') {
      const existing = document.querySelector('.message');
      if (existing) existing.remove();

      const msg = document.createElement('div');
      msg.className = `message ${type}`;
      msg.textContent = text;
      document.body.appendChild(msg);

      setTimeout(() => msg.remove(), 3000);
    }

    // Show winner
    function showWinner(winner) {
      const modal = document.getElementById('winModal');
      const winnerText = document.getElementById('winnerText');

      if (winner === myColor) {
        winnerText.textContent = t.youWin;
        playSound('win');
      } else {
        winnerText.textContent = t.opponentWins;
        playSound('lose');
      }

      modal.style.display = 'flex';
    }

    // Handle Enter key
    document.getElementById('roomCodeInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') joinGame();
    });

    document.getElementById('playerName').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        const code = document.getElementById('roomCodeInput').value;
        if (code.length === 4) {
          joinGame();
        } else {
          createGame();
        }
      }
    });

    // Only allow numbers in room code
    document.getElementById('roomCodeInput').addEventListener('input', (e) => {
      e.target.value = e.target.value.replace(/[^0-9]/g, '');
    });
  </script>
</body>
</html>
